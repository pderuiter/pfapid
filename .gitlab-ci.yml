# pfapid: REST API for OpenBSD pf (see docs/DESIGN.md and RELEASING.md).
#
#   MR / branch  lint (blocking), unit tests with -race, openbsd/amd64 binary,
#                govulncheck / gosec / trivy
#   main         same; mirror:github pushes main to GitHub; release:tag
#                (toolkit) tags vX.Y.Z from the Conventional Commits
#   tag vX.Y.Z   tests again, then
#                  build:release   GoReleaser, build only: tar.gz per arch, SHA256SUMS
#                  sign:gpg        SHA256SUMS.sig (scripts/release-signing-key.asc)
#                  sign:cosign     <file>.sigstore.json with the estate cosign key
#                  publish:nexus   the signed set -> Nexus software-packages/pfapid/<version>/
#                  publish:github  those files, from Nexus, -> GitHub release
#
# Integration tests against real pfctl run on an OpenBSD lab machine, not in
# CI: the runners are Linux. Secrets come from Vault through the JWT role
# RELEASE_VAULT_ROLE, bound to this project's protected refs.
include:
  - project: wbyc/infra/ci-cd-toolkit
    ref: $CI_CD_TOOLKIT_VERSION
    file:
      - /templates/common/stages.yml
      - /templates/ci/go.yml
      - /templates/common/release.yml
      - /templates/common/cosign.yml

# MR pipelines for MR branches, branch pipelines otherwise: one pipeline per
# push, not a duplicate branch + MR pair.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  CI_CD_TOOLKIT_VERSION: "v3.12.3"
  APP_NAME: "pfapid"
  GO_MAIN_PACKAGE: "./cmd/pfapid"
  # pfapid only runs on OpenBSD; linux/amd64 keeps `-n` (config check)
  # usable on workstations and runners.
  BUILD_PLATFORMS: "openbsd/amd64,linux/amd64"
  # Must be >= the go line in go.mod (GOTOOLCHAIN=local in the image).
  BASE_GO_VERSION: "1.2.0"
  # -coverpkg: coverage across packages (cmd/pfapid tests exercise
  # internal/pki), which is what SonarQube reads from coverage.out.
  GO_TEST_FLAGS: "-race -coverprofile=coverage.out -covermode=atomic -coverpkg=./..."
  # Release (same Vault role, signing key and GitHub token as the pderuiter
  # Terraform providers). Its own variable: the wbyc group variable
  # VAULT_AUTH_ROLE would override a YAML VAULT_AUTH_ROLE.
  RELEASE_VAULT_ROLE: "gitlab-ci-terraform-registry"
  # KV v2 paths under secret/: gpg {private_key, passphrase}.
  VAULT_SECRET_BASE: "wbyc/prd/infra/terraform-registry"
  VAULT_GITHUB_PATH: "wbyc/prd/infra/github/pderuiter"
  VAULT_NEXUS_PATH: "prod/nexus/ci-publish"
  NEXUS_URL: "https://nexus.bsdserver.nl"
  NEXUS_RAW_REPO: "software-packages"
  GITHUB_REPOSITORY: "pderuiter/pfapid"
  ALPINE_IMAGE: "${NEXUS_DOCKERHUB}/library/alpine:3.24.2"

# ==============================================================================
# Lint: blocking (the toolkit marks its lint jobs allow_failure).
# ==============================================================================

lint:golangci:
  allow_failure: false

lint:go-vet:
  allow_failure: false

lint:go-fmt:
  allow_failure: false

# The OpenBSD-only files (pledge/unveil) are invisible to a linux vet.
lint:go-vet-openbsd:
  extends: .go_base
  stage: lint
  script:
    - GOOS=openbsd GOARCH=amd64 go vet ./...

# Short fuzz run of the renderer: a validated anchor must never render to
# anything but one guarded rule line per rule (injection guard).
test:fuzz-render:
  extends: .go_base
  stage: test
  script:
    - go test -run='^$' -fuzz=FuzzAnchor -fuzztime=60s ./internal/render

# The toolkit's GitLab-only binary release is replaced by the signed release
# below.
publish:binaries:
  rules:
    - when: never

# ==============================================================================
# GitHub mirror and release.
# ==============================================================================

.release_vault:
  id_tokens:
    VAULT_ID_TOKEN:
      aud: "${CI_SERVER_URL}"
  interruptible: false
  # The Vault role only admits protected refs; don't start where it refuses.
  rules:
    - if: $CI_COMMIT_REF_PROTECTED != "true"
      when: never

# Release tags: vX.Y.Z or vX.Y.Z-<pre> (published as GitHub pre-releases).
.release_tag_rules:
  rules:
    - !reference [.release_vault, rules]
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/

# Push main to GitHub. Fast-forward only: a commit made on GitHub fails this job.
mirror:github:
  extends: .release_vault
  stage: publish
  image: ${ALPINE_IMAGE}
  variables:
    GIT_DEPTH: "0"
    GIT_STRATEGY: clone
  needs:
    - job: test:unit
  before_script:
    - apk add --no-cache git curl jq >/dev/null
  script:
    - . scripts/vault.sh
    - vault_login
    - export GITHUB_TOKEN="$(vault_kv "${VAULT_GITHUB_PATH}" token)"
    - scripts/github-mirror.sh branch
  rules:
    - !reference [.release_vault, rules]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"

# GoReleaser in the standard Go image, build only (no signing, no publishing,
# no secrets).
build:release:
  extends: .go_base
  stage: build
  needs:
    - job: test:unit
  script:
    - go install "github.com/goreleaser/goreleaser/v2@${GORELEASER_VERSION}"
    - goreleaser release --clean --skip=publish
    - (cd dist && sha256sum -c pfapid_*_SHA256SUMS)
  artifacts:
    paths:
      - dist/*.tar.gz
      - dist/*_SHA256SUMS
    expire_in: 30 days
  rules:
    - !reference [.release_tag_rules, rules]

sign:gpg:
  extends: .release_vault
  stage: build
  image: ${ALPINE_IMAGE}
  needs:
    - job: build:release
  script:
    - scripts/sign-gpg.sh
  artifacts:
    paths:
      - dist/*_SHA256SUMS.sig
    expire_in: 30 days
  rules:
    - !reference [.release_tag_rules, rules]

# Estate rule: every artefact we build is cosign-signed (transit key
# cosign-estate), through the release role, which carries the transit policy
# for this project's protected tags.
sign:cosign:
  extends: .cosign_sign_blob
  stage: build
  needs:
    - job: build:release
  variables:
    COSIGN_VAULT_ROLE: "${RELEASE_VAULT_ROLE}"
    COSIGN_BLOBS: "dist/*.tar.gz dist/*_SHA256SUMS"
  interruptible: false
  rules:
    - if: $COSIGN_SIGNING_ENABLED == "false"
      when: never
    - !reference [.release_tag_rules, rules]

publish:nexus:
  extends: .release_vault
  stage: publish
  image: ${ALPINE_IMAGE}
  needs:
    - job: build:release
    - job: sign:gpg
    - job: sign:cosign
  script:
    - scripts/publish-nexus.sh
  rules:
    - !reference [.release_tag_rules, rules]

publish:github:
  extends: .release_vault
  stage: publish
  image: ${ALPINE_IMAGE}
  variables:
    GIT_DEPTH: "0"
    GIT_STRATEGY: clone
  needs:
    - job: publish:nexus
      artifacts: false
  script:
    - scripts/publish-github.sh
  rules:
    - !reference [.release_tag_rules, rules]
