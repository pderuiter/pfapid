# SonarQube analysis for scan:sonarqube (ci-cd-toolkit). With this file the
# toolkit runs sonar-scanner as-is (adding sonar.projectVersion), so the
# settings it would otherwise pass are repeated here. It exists for the Go
# coverage: the toolkit does not pass coverage.out (from test:unit) to
# SonarQube, which made new code count as 0% covered.
sonar.projectKey=wbyc-infra-pfapid
sonar.qualitygate.wait=true

sonar.sources=.
# coverage.html/xml are test:unit artifacts in the checkout, not source.
sonar.exclusions=**/*_test.go,**/vendor/**,**/dist/**,coverage.*,docs/**,deploy/**,scripts/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=coverage.out
# OS glue that only runs on OpenBSD (pledge/unveil, the privsep re-exec and
# signal handling in main): exercised on a real OpenBSD machine, not on the
# Linux CI runners.
sonar.coverage.exclusions=internal/sandbox/**,cmd/pfapid/main.go

sonar.sourceEncoding=UTF-8
